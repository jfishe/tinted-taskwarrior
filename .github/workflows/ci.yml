name: "CI"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: "Lint and test"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: "Fetch the repository code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: "astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884" # v10.3.0

      - name: "Install Taskwarrior"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends taskwarrior

      - name: "Install dependencies"
        run: uv sync --locked

      - name: "Test"
        run: uv run pytest

      - name: "Lint"
        run: |
          uv run ruff check .
          uv run ruff format --check .
          shellcheck -x -P SCRIPTDIR/.. gen-templates.sh build.sh demo/*.sh

      - name: "Type check"
        run: uv run pyrefly check
